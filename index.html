<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herramientas RUUTS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Passion+One:wght@700&family=Fustat:wght@500;700&display=swap">
<style>
:root{--ink:#152018;--lime:#cdee5a;--paper:#f7f8f1;--muted:#5f6f60}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Fustat',Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:40px 16px;display:grid;gap:18px}
h1{font-family:'Passion One','Arial Black',sans-serif;text-transform:uppercase;font-size:44px;line-height:1;margin:0}
p{margin:0;color:var(--muted)}
a.tool{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 5px 0 0 var(--ink);padding:16px 18px}

a.tool b{font-family:'Passion One','Arial Black',sans-serif;text-transform:uppercase;font-size:24px}
</style></head><body><main>
<h1>Herramientas RUUTS</h1>
<p>Utilidades pequeñas para el equipo de la tienda.</p>
<a class="tool" href="programador-banners/"><b>Programador de banners</b><span>Genera las fechas en hora de Colombia para los slides del banner del home.</span></a>
<a class="tool" href="variantes-producto/"><b>Variantes al producto</b><span>Sube el export de productos y el xlsx de combinaciones y descarga el CSV listo para importar.</span></a>
</main></body></html>
